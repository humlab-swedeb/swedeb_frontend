name: Release

on:
  push:
    branches:
      - main
      - staging
      - test
  workflow_dispatch:

jobs:
  release:
    name: Build, Version, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push tags, update changelog, and manage releases
      issues: write # to comment on issues
      pull-requests: write # to comment on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set up pnpm and install dependencies
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: true

      - name: Run semantic-release (main branch only)
        id: semantic_release
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release

      - name: Prepare release metadata
        id: release_meta
        run: |
          BRANCH="${{ github.ref_name }}"

          if [ "${BRANCH}" = "main" ]; then
            # For main, use semantic-release output
            VERSION="${{ steps.semantic_release.outputs.new_release_version }}"
            IS_NEW_RELEASE="${{ steps.semantic_release.outputs.new_release_published }}"
            TARBALL="frontend-${VERSION}.tar.gz"
            RELEASE_TAG="v${VERSION}"
            PRERELEASE="false"
            TITLE="Release ${VERSION}"
            NOTES="See CHANGELOG.md for details"
          else
            # For staging/test, use package.json version with branch suffix
            # and a namespaced release tag so it does not collide with the
            # branch name in local git clones.
            VERSION=$(pnpm pkg get version | tr -d '"')
            IS_NEW_RELEASE="true"
            TARBALL="frontend-${BRANCH}.tar.gz"
            RELEASE_TAG="frontend-${BRANCH}"
            PRERELEASE="true"
            TITLE="${BRANCH^} Build"
            NOTES="Latest ${BRANCH} build (version ${VERSION})"

            # Build assets for non-main branches
            echo "Building assets for ${BRANCH} branch, version: ${VERSION}"
            ./.github/scripts/build-assets.sh "${VERSION}" "${BRANCH}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "tarball=${TARBALL}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "is_new_release=${IS_NEW_RELEASE}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Create or update GitHub release
        if: steps.release_meta.outputs.is_new_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.release_meta.outputs.branch }}"
          RELEASE_TAG="${{ steps.release_meta.outputs.release_tag }}"
          TARBALL="${{ steps.release_meta.outputs.tarball }}"
          PRERELEASE="${{ steps.release_meta.outputs.prerelease }}"
          TITLE="${{ steps.release_meta.outputs.title }}"
          NOTES="${{ steps.release_meta.outputs.notes }}"

          if [ "${BRANCH}" = "main" ]; then
            # For main branch, create a new versioned release
            echo "Creating release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" \
              "dist/${TARBALL}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --latest
          else
            # For staging/test, create or update pre-release
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Updating existing ${BRANCH} pre-release..."
              gh release delete-asset "${RELEASE_TAG}" "${TARBALL}" --yes 2>/dev/null || true
              gh release upload "${RELEASE_TAG}" "dist/${TARBALL}" --clobber
            else
              echo "Creating new ${BRANCH} pre-release..."
              gh release create "${RELEASE_TAG}" \
                "dist/${TARBALL}" \
                --title "${TITLE}" \
                --notes "${NOTES}" \
                --prerelease \
                --target "${BRANCH}"
            fi
          fi
