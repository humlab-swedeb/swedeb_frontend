name: Release

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  release:
    name: Build, Version, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push tags and update changelog
      issues: write # to comment on issues
      pull-requests: write # to comment on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set up pnpm and install dependencies
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: true

      - name: Run semantic-release (main branch only)
        id: semantic_release
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release

      - name: Build and create staging release
        if: github.ref_name == 'staging'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get current version from package.json
          VERSION=$(pnpm pkg get version | tr -d '"')
          echo "Building staging release for version: ${VERSION}"

          # Build the frontend using the shared build script
          ./.github/scripts/build-assets.sh "${VERSION}" staging

          # Create or update staging release
          gh release delete staging --yes || true
          gh release create staging \
            --title "Staging Build v${VERSION}" \
            --notes "Staging build from version ${VERSION}
            
            This is a pre-production build for testing purposes.
            
            **Branch**: staging
            **Commit**: ${{ github.sha }}
            **Build Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            --prerelease \
            "dist/frontend-${VERSION}-staging.tar.gz"

          echo "✅ Staging release created: frontend-${VERSION}-staging.tar.gz"
